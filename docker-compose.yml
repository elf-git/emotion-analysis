version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: meld_emotion_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./exports:/app/exports:ro
      - ./checkpoints:/app/checkpoints:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: meld_emotion_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
